  # 📊 Gráficos
  fl_chart: ^0.66.0

  # 📷 Imagens
  image_picker: ^1.0.4

  # 🎨 Fontes
  google_fonts: ^6.2.1

  # 🌐 Locale / datas
  intl: ^0.20.2

  # 🔐 Auth
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.2.0
  dio: ^5.7.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0

  flutter_lints: ^6.0.0

flutter:
