name: fox_link_app
description: Fox Link SaaS
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 Firebase
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.9.4

  # 🧠 Arquitetura
  get_it: ^7.6.0
  go_router: ^14.2.0
